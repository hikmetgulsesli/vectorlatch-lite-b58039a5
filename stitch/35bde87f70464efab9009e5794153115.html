<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gameplay - VectorLatch Lite</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&amp;family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&amp;family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#272a31",
                        "on-secondary": "#053900",
                        "secondary-fixed": "#79ff5b",
                        "on-secondary-fixed": "#022100",
                        "surface-container": "#1d2026",
                        "error-container": "#93000a",
                        "inverse-on-surface": "#2e3037",
                        "tertiary-fixed": "#ffd7f5",
                        "primary-fixed-dim": "#00dbe9",
                        "primary-container": "#00f0ff",
                        "secondary-container": "#2ff801",
                        "tertiary-container": "#ffc9f4",
                        "on-secondary-container": "#0f6d00",
                        "outline-variant": "#3b494b",
                        "on-tertiary-fixed-variant": "#810081",
                        "background": "#10131a",
                        "on-secondary-fixed-variant": "#095300",
                        "on-tertiary-container": "#a900a9",
                        "inverse-primary": "#006970",
                        "on-primary-fixed": "#002022",
                        "surface-dim": "#10131a",
                        "surface-bright": "#363940",
                        "secondary": "#d7ffc5",
                        "on-tertiary": "#5b005b",
                        "on-error-container": "#ffdad6",
                        "primary-fixed": "#7df4ff",
                        "outline": "#849495",
                        "on-surface-variant": "#b9cacb",
                        "on-error": "#690005",
                        "surface": "#10131a",
                        "surface-tint": "#00dbe9",
                        "on-background": "#e1e2eb",
                        "on-surface": "#e1e2eb",
                        "on-tertiary-fixed": "#380038",
                        "tertiary-fixed-dim": "#ffabf3",
                        "surface-variant": "#32353c",
                        "on-primary-fixed-variant": "#004f54",
                        "tertiary": "#fff3f9",
                        "inverse-surface": "#e1e2eb",
                        "surface-container-highest": "#32353c",
                        "surface-container-lowest": "#0b0e14",
                        "on-primary": "#00363a",
                        "surface-container-low": "#191c22",
                        "on-primary-container": "#006970",
                        "primary": "#dbfcff",
                        "error": "#ffb4ab",
                        "secondary-fixed-dim": "#2ae500"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "12px",
                        "hud-padding": "16px",
                        "safe-area": "24px",
                        "unit": "4px",
                        "node-gap": "8px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Space Grotesk"],
                        "label-caps": ["Space Mono"],
                        "data-point": ["Space Mono"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Space Grotesk"],
                        "display-score": ["Space Mono"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "data-point": ["14px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "display-score": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .cyber-grid {
            background-image: 
                linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .scanline {
            background: linear-gradient(to bottom, rgba(0,0,0,0) 50%, rgba(0,0,0,0.1) 50%);
            background-size: 100% 4px;
        }
        .glow-cyan { text-shadow: 0 0 10px rgba(0, 240, 255, 0.7); }
        .glow-magenta { box-shadow: 0 0 15px rgba(255, 0, 255, 0.6); }
        .glow-green { box-shadow: 0 0 15px rgba(47, 248, 1, 0.6); }
        .latch-animation {
            animation: moveLatch 2s ease-in-out infinite alternate;
        }
        @keyframes moveLatch {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw - 48px - 32px)); } /* viewport width - safe area - latch width */
        }
        @media (min-width: 768px) {
            @keyframes moveLatch {
                0% { transform: translateX(0); }
                100% { transform: translateX(calc(100vw - 48px - 48px)); }
            }
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface h-screen w-screen overflow-hidden cyber-grid relative font-body-md text-body-md select-none">
<!-- HUD Overlay -->
<div class="fixed inset-0 z-50 pointer-events-none p-safe-area flex flex-col justify-between">
<!-- Top HUD -->
<div class="flex justify-between items-start pointer-events-auto">
<!-- Score & Level -->
<div class="bg-surface/70 backdrop-blur-md border border-primary/20 p-hud-padding rounded-DEFAULT scanline relative overflow-hidden flex items-center gap-6">
<div>
<div class="font-label-caps text-label-caps text-outline-variant mb-1">SCORE</div>
<div class="font-display-score text-display-score text-primary glow-cyan">01459</div>
</div>
<div class="h-10 w-px bg-primary/20"></div>
<div class="text-right">
<div class="font-label-caps text-label-caps text-outline-variant mb-1">LVL</div>
<div class="font-data-point text-data-point text-secondary-container">04</div>
</div>
</div>
<!-- Top Right Controls & Status -->
<div class="flex gap-4 items-center">
<!-- Latch Power Meter -->
<div class="bg-surface/70 backdrop-blur-md border border-primary/20 p-hud-padding rounded-DEFAULT scanline flex flex-col gap-2 w-48 hidden md:flex">
<div class="flex justify-between font-label-caps text-label-caps">
<span class="text-outline-variant">LATCH POWER</span>
<span class="text-tertiary-container">85%</span>
</div>
<div class="h-2 bg-surface-container-high rounded-full overflow-hidden w-full relative">
<div class="absolute top-0 left-0 h-full w-[85%] bg-tertiary-container shadow-[0_0_10px_rgba(255,201,244,0.5)]"></div>
</div>
</div>
<!-- Pause Button -->
<button aria-label="ACT_PAUSE_GAME" class="bg-surface/70 backdrop-blur-md border border-primary/20 p-3 rounded-DEFAULT hover:bg-primary/10 transition-colors text-primary">
<span class="material-symbols-outlined">pause</span>
</button>
</div>
</div>
<!-- Bottom HUD -->
<div class="flex justify-center pointer-events-auto">
<!-- Mobile Latch Power Meter -->
<div class="md:hidden bg-surface/70 backdrop-blur-md border border-primary/20 p-hud-padding rounded-DEFAULT scanline flex flex-col gap-2 w-full max-w-xs">
<div class="flex justify-between font-label-caps text-label-caps">
<span class="text-outline-variant">PWR</span>
<span class="text-tertiary-container">85%</span>
</div>
<div class="h-1.5 bg-surface-container-high rounded-full overflow-hidden w-full relative">
<div class="absolute top-0 left-0 h-full w-[85%] bg-tertiary-container shadow-[0_0_10px_rgba(255,201,244,0.5)]"></div>
</div>
</div>
</div>
</div>
<!-- Playfield (Canvas Area) -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none px-safe-area">
<!-- The Vector Rail -->
<div class="w-full h-1 bg-primary/30 relative shadow-[0_0_20px_rgba(0,240,255,0.4)]">
<!-- Central Line Brightness -->
<div class="absolute inset-0 h-px bg-primary/80 top-1/2 -translate-y-1/2"></div>
<!-- Vector Nodes (Green) -->
<div class="absolute top-1/2 -translate-y-1/2 left-[20%] w-4 h-4 rounded-full border-2 border-secondary-container bg-secondary-container/10 glow-green"></div>
<div class="absolute top-1/2 -translate-y-1/2 left-[50%] w-6 h-6 rounded-full border-2 border-secondary-container bg-secondary-container/20 glow-green flex items-center justify-center">
<div class="w-1.5 h-1.5 bg-secondary-container rounded-full"></div>
</div>
<div class="absolute top-1/2 -translate-y-1/2 left-[80%] w-4 h-4 rounded-full border-2 border-secondary-container bg-secondary-container/10 glow-green"></div>
<!-- The Latch (Magenta) -->
<div class="absolute top-1/2 -translate-y-1/2 left-0 w-8 h-12 md:w-12 md:h-16 border-2 border-[#ff00ff] bg-[#ff00ff]/20 glow-magenta latch-animation flex flex-col justify-between items-center py-1">
<div class="w-full h-0.5 bg-[#ff00ff]"></div>
<div class="w-2 h-2 rounded-full bg-[#ff00ff] shadow-[0_0_5px_#ff00ff]"></div>
<div class="w-full h-0.5 bg-[#ff00ff]"></div>
</div>
</div>
</div>
<!-- Pre-game / Start Overlay (Hidden during active gameplay, shown here for state requirement) -->
<div class="absolute inset-0 z-40 bg-surface-container-lowest/80 backdrop-blur-sm flex items-center justify-center flex-col gap-8 hidden" id="startScreen">
<h1 class="font-headline-lg text-headline-lg md:text-[64px] text-primary tracking-widest glow-cyan">VECTORLATCH LITE</h1>
<button aria-label="ACT_START_GAME" class="bg-primary-container text-on-primary-container px-8 py-4 font-label-caps text-label-caps rounded-DEFAULT hover:shadow-[0_0_20px_rgba(0,240,255,0.6)] transition-all active:scale-95" onclick="document.getElementById('startScreen').classList.add('hidden')">
            START GAME
        </button>
</div>
</body></html>
